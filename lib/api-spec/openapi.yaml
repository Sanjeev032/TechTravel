openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Namrata Universal API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: navbar
    description: Navigation data
  - name: hero
    description: Hero section
  - name: about
    description: About section
  - name: services
    description: Services section
  - name: projects
    description: Projects/portfolio
  - name: testimonials
    description: Client testimonials
  - name: blogs
    description: Blog posts
  - name: technologies
    description: Technology stack
  - name: team
    description: Team members
  - name: contact
    description: Contact information
  - name: footer
    description: Footer data
  - name: stats
    description: Company statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /navbar:
    get:
      operationId: getNavbar
      tags: [navbar]
      summary: Get navigation data
      responses:
        "200":
          description: Navigation data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Navbar"

  /hero:
    get:
      operationId: getHero
      tags: [hero]
      summary: Get hero section data
      responses:
        "200":
          description: Hero data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hero"

  /about:
    get:
      operationId: getAbout
      tags: [about]
      summary: Get about section data
      responses:
        "200":
          description: About data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/About"

  /services:
    get:
      operationId: getServices
      tags: [services]
      summary: Get all services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: Get all projects
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  /testimonials:
    get:
      operationId: getTestimonials
      tags: [testimonials]
      summary: Get all testimonials
      responses:
        "200":
          description: List of testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"

  /blogs:
    get:
      operationId: getBlogs
      tags: [blogs]
      summary: Get all blog posts
      responses:
        "200":
          description: List of blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Blog"

  /technologies:
    get:
      operationId: getTechnologies
      tags: [technologies]
      summary: Get all technologies
      responses:
        "200":
          description: List of technologies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Technology"

  /team:
    get:
      operationId: getTeam
      tags: [team]
      summary: Get all team members
      responses:
        "200":
          description: List of team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"

  /contact:
    get:
      operationId: getContact
      tags: [contact]
      summary: Get contact information
      responses:
        "200":
          description: Contact data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactFormInput"
      responses:
        "200":
          description: Form submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactFormResponse"

  /footer:
    get:
      operationId: getFooter
      tags: [footer]
      summary: Get footer data
      responses:
        "200":
          description: Footer data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Footer"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get company statistics
      responses:
        "200":
          description: Stats data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stat"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    NavItem:
      type: object
      required: [label, href]
      properties:
        label:
          type: string
        href:
          type: string
        children:
          type: array
          items:
            type: object
            required: [label, href]
            properties:
              label:
                type: string
              href:
                type: string

    Navbar:
      type: object
      required: [logo, items, ctaLabel, ctaHref]
      properties:
        logo:
          type: string
        logoText:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/NavItem"
        ctaLabel:
          type: string
        ctaHref:
          type: string

    HeroBadge:
      type: object
      required: [text]
      properties:
        text:
          type: string

    Hero:
      type: object
      required: [badge, title, subtitle, description, primaryCtaLabel, primaryCtaHref, secondaryCtaLabel, secondaryCtaHref]
      properties:
        badge:
          $ref: "#/components/schemas/HeroBadge"
        title:
          type: string
        titleHighlight:
          type: string
        subtitle:
          type: string
        description:
          type: string
        primaryCtaLabel:
          type: string
        primaryCtaHref:
          type: string
        secondaryCtaLabel:
          type: string
        secondaryCtaHref:
          type: string
        floatingTags:
          type: array
          items:
            type: string

    About:
      type: object
      required: [sectionTag, title, description, mission, vision]
      properties:
        sectionTag:
          type: string
        title:
          type: string
        titleHighlight:
          type: string
        description:
          type: string
        mission:
          type: string
        vision:
          type: string
        highlights:
          type: array
          items:
            type: string
        yearsOfExperience:
          type: integer
        clientsSatisfied:
          type: integer
        projectsCompleted:
          type: integer

    Service:
      type: object
      required: [id, icon, title, description, features]
      properties:
        id:
          type: integer
        icon:
          type: string
        title:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            type: string
        color:
          type: string

    Project:
      type: object
      required: [id, title, category, description, imageUrl, tags]
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        tags:
          type: array
          items:
            type: string
        liveUrl:
          type: ["string", "null"]
        featured:
          type: boolean

    Testimonial:
      type: object
      required: [id, name, company, role, content, rating]
      properties:
        id:
          type: integer
        name:
          type: string
        company:
          type: string
        role:
          type: string
        content:
          type: string
        rating:
          type: integer
        avatarUrl:
          type: ["string", "null"]

    Blog:
      type: object
      required: [id, title, excerpt, category, author, publishedAt, readTime, imageUrl]
      properties:
        id:
          type: integer
        title:
          type: string
        excerpt:
          type: string
        category:
          type: string
        author:
          type: string
        publishedAt:
          type: string
        readTime:
          type: string
        imageUrl:
          type: string
        slug:
          type: string

    Technology:
      type: object
      required: [id, name, logoUrl, category]
      properties:
        id:
          type: integer
        name:
          type: string
        logoUrl:
          type: string
        category:
          type: string

    TeamMember:
      type: object
      required: [id, name, role, bio, imageUrl]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        bio:
          type: string
        imageUrl:
          type: string
        linkedin:
          type: ["string", "null"]
        twitter:
          type: ["string", "null"]

    ContactInfo:
      type: object
      required: [icon, label, value]
      properties:
        icon:
          type: string
        label:
          type: string
        value:
          type: string
        href:
          type: ["string", "null"]

    Contact:
      type: object
      required: [sectionTag, title, description, email, phone, address, infos]
      properties:
        sectionTag:
          type: string
        title:
          type: string
        description:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        mapEmbedUrl:
          type: ["string", "null"]
        infos:
          type: array
          items:
            $ref: "#/components/schemas/ContactInfo"

    ContactFormInput:
      type: object
      required: [name, email, subject, message]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        subject:
          type: string
          minLength: 3
        message:
          type: string
          minLength: 10
        phone:
          type: ["string", "null"]

    ContactFormResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    FooterLink:
      type: object
      required: [label, href]
      properties:
        label:
          type: string
        href:
          type: string

    FooterColumn:
      type: object
      required: [title, links]
      properties:
        title:
          type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/FooterLink"

    SocialLink:
      type: object
      required: [platform, href, icon]
      properties:
        platform:
          type: string
        href:
          type: string
        icon:
          type: string

    Footer:
      type: object
      required: [logo, logoText, description, columns, socials, copyright, newsletterTitle, newsletterDescription]
      properties:
        logo:
          type: string
        logoText:
          type: string
        description:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/FooterColumn"
        socials:
          type: array
          items:
            $ref: "#/components/schemas/SocialLink"
        copyright:
          type: string
        newsletterTitle:
          type: string
        newsletterDescription:
          type: string

    Stat:
      type: object
      required: [id, value, label, suffix]
      properties:
        id:
          type: integer
        value:
          type: integer
        label:
          type: string
        suffix:
          type: string
        prefix:
          type: string
